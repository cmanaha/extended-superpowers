name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # claude CLI is intentionally optional in ci.sh; manifest JSON is always
      # validated. When a CI-friendly `claude plugin validate` path is wired,
      # add it here (see ADR/plan).
      - name: Run ci.sh
        run: bash scripts/ci.sh
