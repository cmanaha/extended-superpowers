name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Native installer per https://code.claude.com/docs/en/setup — installs
      # to ~/.local/bin. Enables `claude plugin validate` (ci.sh step 1) and
      # the sandboxed install smoke test (ci.sh step 6, regression guard for
      # issue #1). ci.sh still degrades gracefully if this step is removed.
      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run ci.sh
        run: bash scripts/ci.sh
